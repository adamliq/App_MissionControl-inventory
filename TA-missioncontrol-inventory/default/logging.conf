[loggers]
keys=root

[handlers]
keys=mc_file

[formatters]
keys=mc_format

[logger_root]
level=INFO
handlers=mc_file

[handler_mc_file]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=mc_format
args=('%(SPLUNK_HOME)s/var/log/splunk/mission_control_inventory.log', 'a', 10485760, 3)

[formatter_mc_format]
format=%(asctime)s, level=%(levelname)s, pid=%(process)s, logger=%(name)s, %(message)s
